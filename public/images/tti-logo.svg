<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TTi logo">
  <!-- App icon — black square as in brand lockup -->
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <!-- TTi wordmark — TT in TTi Navy, i in TTi Lime -->
  <g text-anchor="middle" dominant-baseline="central">
    <!-- TT -->
    <text x="202" y="278" font-family="'DM Sans', Inter, system-ui, sans-serif" font-size="240" font-weight="800" letter-spacing="-18" fill="#343B8C">TT</text>
    <!-- i stem — lime vertical + dot -->
    <text x="378" y="278" font-family="'DM Sans', Inter, system-ui, sans-serif" font-size="240" font-weight="800" letter-spacing="-10" fill="#B7D235">i</text>
    <!-- i dot — slightly larger, offset to match brand (bright lime) -->
    <circle cx="384.5" cy="112" r="27" fill="#C5E14B" />
    <circle cx="384.5" cy="112" r="27" fill="#B7D235" opacity="0.98"/>
  </g>
</svg>
